<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="Discord-Symbol.png" />

    <title>Invite</title>
    <link rel="stylesheet" href="./index.css" />
  </head>
  <body>
    <main>
      <h1 id="guild-name">The Burrow</h1>
      <h2><a href="https://discord.gg/KFQ6gXPtAn">join us on discord</a></h2>

      <section id="info-container">
        <div id="members"></div>
      </section>
    </main>
  </body>

  <script>
    (async () => {
      const memberContainer = document.getElementById("members");
      const members = await fetch("/members").then((res) => res.json());
      members.forEach((member) => {
        const div = document.createElement("div");
        div.id = member.name;
        div.classList.add("member-icon");
        const img = document.createElement("img");
        img.src = member.avatar;
        div.appendChild(img);
        memberContainer.appendChild(div);
      });

      const memberCount = document.createElement("p");
      memberCount.textContent = `${String(members.length)} furry friends`;
      document.getElementById("info-container").appendChild(memberCount);
    })();
  </script>
</html>
